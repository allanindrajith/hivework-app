# Windows build — produces Hivework's NSIS installers for x64 and arm64
# on a native windows-latest (x64) runner. arm64 is cross-compiled in-OS via
# the aarch64-pc-windows-msvc target (the same trick the local VM matrix uses),
# so one runner yields both installers.
#
# Signing: DEFERRED for v0.1.0 (see memory-bank/decisions.md 2026-06-16). The
# installers are unsigned, so Windows SmartScreen warns on first launch
# ("More info -> Run anyway"). When a code-signing cert (EV or Azure Trusted
# Signing) is in place, signing slots in after each build step. Updater
# artifacts are disabled (auto-update deferred), so no signing key is needed.
#
# Output: the x64 + arm64 NSIS .exe installers uploaded to the workflow run.

name: Windows Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build Windows installers (x64 + arm64, unsigned)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable (+ arm64 target)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # x64 (native). Builds NSIS installer and updater artifacts if TAURI_SIGNING_PRIVATE_KEY is present.
      - name: Build x64 installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npm run tauri build -- --target x86_64-pc-windows-msvc
          else
            npm run tauri build -- --target x86_64-pc-windows-msvc --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      # arm64 (cross-compiled in-OS).
      - name: Build arm64 installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npm run tauri build -- --target aarch64-pc-windows-msvc
          else
            npm run tauri build -- --target aarch64-pc-windows-msvc --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      - name: Upload x64 installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hivework-windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.nsis.zip*
          if-no-files-found: error

      - name: Upload arm64 installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hivework-windows-arm64
          path: |
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.nsis.zip*
          if-no-files-found: error
